<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAI PITANGA - Login do Sistema</title>
    <style>
        :root {
            --primary: #2c3e50; 
            --accent: #27ae60; 
            --alert: #e74c3c;
            --dark: #1a1a1a; 
            --text: #ecf0f1; 
            --highlight: #f1c40f;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            height: 100vh;
            background: radial-gradient(circle, #2c3e50, #1a1a1a);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
        }

        .login-box {
            background: var(--primary);
            padding: 40px;
            border-radius: 15px;
            border: 2px solid var(--highlight);
            width: 320px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0,0,0,0.7);
        }

        .brand-header {
            background: var(--highlight);
            color: #000;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            font-weight: 900;
            font-size: 22px;
            margin-bottom: 20px;
        }

        .login-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 6px;
            border: 1px solid #34495e;
            background: #111;
            color: white;
            box-sizing: border-box;
        }

        .btn-action {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            background: var(--accent);
            color: white;
            transition: 0.3s;
        }

        .btn-action:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <div class="brand-header">VAI PITANGA</div>
        <form onsubmit="autenticar(event)">
            <input type="text" id="user-input" placeholder="Usuário" required>
            <input type="password" id="pass-input" placeholder="Senha" required>
            <button type="submit" class="btn-action">LOGON SISTEMA</button>
        </form>
        <p id="login-error" style="color:var(--alert); font-size:11px; margin-top:12px; display:none;">Credenciais Inválidas</p>
    </div>

    <script>
        // Redireciona automaticamente para o mapa se já estiver autenticado
        if (sessionStorage.getItem('authenticated') === 'true') {
            window.location.href = 'index.html';
        }

        function autenticar(event) {
            event.preventDefault();
            const user = document.getElementById('user-input').value;
            const pass = document.getElementById('pass-input').value;

            if (user === "usuario" && pass === "senha") {
                sessionStorage.setItem('authenticated', 'true');
                window.location.href = 'index.html';
            } else {
                document.getElementById('login-error').style.display = 'block';
            }
        }
    </script>
</body>
</html>
